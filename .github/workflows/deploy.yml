name: Deploy

# Runs on the self-hosted runner (it has access to the local Docker daemon and MinIO).
# Only ever triggered by pushes to protected branches, never by fork PRs.
on:
  push:
    branches: [dev, test, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # Build once per SHA, only for the service whose files changed.
  build:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.f.outputs.frontend }}
      backend_changed: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            frontend: ['frontend/**']
            backend: ['backend/**']
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        if: steps.f.outputs.frontend == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
      - name: Build and push backend
        if: steps.f.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, quiz-deploy]
    # GitHub Environment named after the branch; `prod` has a required reviewer.
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    env:
      TF_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      # The runner is a container: the host's published ports are reached via
      # host.docker.internal, not 127.0.0.1.
      MINIO_ENDPOINT: http://host.docker.internal:9000
      HOST_ALIAS: host.docker.internal
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.12.2 }
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Independent promotion: each service keeps the image currently deployed
      # unless this push changed it. Current tags are read from the running
      # containers (falling back to this SHA on first deploy).
      - name: Resolve image tags
        run: |
          cur() { docker inspect --format '{{.Config.Image}}' "quiz-${TF_ENV}-$1" 2>/dev/null || true; }
          F=$(cur frontend); B=$(cur backend)
          if [ "${{ needs.build.outputs.frontend_changed }}" = "true" ] || [ -z "$F" ]; then F="${IMAGE_PREFIX}/frontend:${{ github.sha }}"; fi
          if [ "${{ needs.build.outputs.backend_changed }}" = "true" ] || [ -z "$B" ]; then B="${IMAGE_PREFIX}/backend:${{ github.sha }}"; fi
          echo "TF_VAR_frontend_image=$F" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_image=$B" >> "$GITHUB_ENV"
          echo "frontend=$F backend=$B" >> "$GITHUB_STEP_SUMMARY"

      # Terraform state lives in a local MinIO. Create it on first run so no
      # manual bootstrap is needed (idempotent: skipped if already running).
      - name: Ensure state backend (MinIO)
        run: |
          if ! docker inspect quiz-tfstate-minio >/dev/null 2>&1; then
            docker run -d --name quiz-tfstate-minio --restart unless-stopped --user root \
              -p 127.0.0.1:9000:9000 -p 127.0.0.1:9001:9001 \
              -v quiz-tfstate-minio:/data \
              -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
              chainguard/minio:latest server /data --console-address :9001
          else
            docker start quiz-tfstate-minio >/dev/null
          fi
          for i in $(seq 1 30); do
            curl -sf "${MINIO_ENDPOINT}/minio/health/ready" && break; sleep 1
          done
          # The MinIO project no longer publishes images to Docker Hub/Quay, so use
          # Chainguard's builds. mc has no shell; it reads its alias from MC_HOST_local.
          export MC_HOST_local="http://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@host.docker.internal:9000"
          mc() { docker run --rm -e MC_HOST_local chainguard/minio-client:latest "$@"; }
          mc mb --ignore-existing local/tfstate
          mc version enable local/tfstate

      - name: Terraform init / plan / apply
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="key=${TF_ENV}/terraform.tfstate" \
            -backend-config="endpoints={s3=\"${MINIO_ENDPOINT}\"}"
          terraform plan -input=false -var-file="envs/${TF_ENV}.tfvars" -out=tfplan
          terraform apply -input=false tfplan

      - name: Smoke test
        run: scripts/smoke-test.sh "$(terraform -chdir=infra output -raw frontend_url | sed "s/localhost/${HOST_ALIAS}/")"

      - name: Integration test (test env only)
        if: env.TF_ENV == 'test'
        run: scripts/integration-test.sh "$(terraform -chdir=infra output -raw frontend_url | sed "s/localhost/${HOST_ALIAS}/")"

      - name: Container logs on failure
        if: failure()
        run: |
          for s in frontend backend db; do echo "== $s =="; docker logs --tail 50 "quiz-${TF_ENV}-$s" || true; done
